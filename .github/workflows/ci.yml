name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ci:
    uses: sensa-code/ci-shared/.github/workflows/node-quality.yml@v1
    with:
      runner: ${{ vars.CI_RUNNER || '"ubuntu-latest"' }}
      node-version: '24'
      typecheck: npm run typecheck
      # npm test 用 devDependency 的 Electron 開隱藏視窗跑 tests/index.html（見 tests/run-headless.cjs）。
      # 在 Windows 上一行就能跑；在 Linux runner 上要多做三件事：
      # 1. Node 24 附的 npm 11 預設不執行相依套件的 install script（allowScripts 政策），
      #    npm ci 之後 node_modules/electron/dist/ 裡沒有執行檔，所以先自己跑 Electron 的 install.js
      #    把執行檔下載回來；執行檔已經在（例如 runner 的 npm 政策不同）就略過。
      # 2. runner 沒有顯示器，用 xvfb-run 開一個虛擬 X server 給 Electron。
      # 3. ubuntu-24.04 映像限制非特權的 user namespace，Chromium 的 SUID sandbox 起不來會直接中止
      #    （「The SUID sandbox helper binary was found, but is not configured correctly」）。
      #    zygote 在主程式的 JS 執行之前就 fork 了，所以 --no-sandbox 不能在 run-headless.cjs 裡
      #    用 app.commandLine 加，要用 Electron 認得的環境變數 ELECTRON_DISABLE_SANDBOX 從外面帶進去。
      test: >-
        (test -x node_modules/electron/dist/electron || node node_modules/electron/install.js)
        && ELECTRON_DISABLE_SANDBOX=1 xvfb-run -a npm test
      build: npm run build
